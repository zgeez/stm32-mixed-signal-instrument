name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware/tests -B firmware/tests/build
      - run: cmake --build firmware/tests/build
      - run: ctest --test-dir firmware/tests/build --output-on-failure
  # A second pass over the same suites, instrumented. The firmware sources are checked for
  # memory errors and undefined behaviour, not only for the answers they return. Kept apart
  # from host-c so a sanitizer finding is distinguishable at a glance from a failed assertion.
  host-c-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware/tests -B firmware/tests/build-san -DFIRMWARE_TESTS_SANITIZE=ON
      - run: cmake --build firmware/tests/build-san
      - run: ctest --test-dir firmware/tests/build-san --output-on-failure

  # gcovr rather than lcov: it is a Python package, so it installs the same way everywhere
  # and does not need its version matched to the compiler's gcov.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "gcovr>=8,<9"
      - run: cmake -S firmware/tests -B firmware/tests/build-cov -DFIRMWARE_TESTS_COVERAGE=ON
      - run: cmake --build firmware/tests/build-cov
      - run: ctest --test-dir firmware/tests/build-cov --output-on-failure
      # Only the application sources are the subject. Counting the test files as well would
      # report a higher number that means less, since a test file runs itself by definition.
      - run: >
          python -m gcovr --root firmware --filter '.*/App/.*' --exclude '.*/tests/.*'
          --txt --print-summary --fail-under-line 85 firmware/tests/build-cov

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -e './desktop[dev]'
      - run: >
          python -m pytest -c desktop/pyproject.toml desktop/tests
          --cov=stm32_msi --cov-report=term-missing --cov-fail-under=85
      - run: python -m ruff check desktop
      - run: python -m ruff format --check desktop
      - run: git diff --check
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
      - run: cmake --preset Debug && cmake --build --preset Debug
        working-directory: firmware
