name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './desktop[dev]'
      - run: python -m pytest -c desktop/pyproject.toml desktop/tests
      - run: python -m ruff check desktop
      - run: python -m ruff format --check desktop
      - run: git diff --check
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
      - run: cmake --preset Debug && cmake --build --preset Debug
        working-directory: firmware
