name: Release

# Cut a release by pushing a tag such as v0.1.0. workflow_dispatch builds the same
# artifacts without publishing, so the whole thing can be rehearsed on a branch rather
# than by pushing a tag that would then have to be deleted.
on:
  push:
    tags: ["v*"]
  # Publishing from the Releases page creates the tag and the release itself. Listening for
  # that too means the assets get attached whichever way the release was started.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Both events can fire for one release. Let them queue rather than race for the upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag, package and firmware agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The firmware carries its version as C macros and the package carries it in
      # pyproject.toml. A tag that means two different numbers is worth failing on here,
      # before any of it is built, rather than discovering it in a published release.
      - id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib
          from pathlib import Path

          header = Path("firmware/App/control/version.h").read_text(encoding="utf-8")
          parts = [
              int(re.search(rf"FIRMWARE_VERSION_{field}\s+(\d+)U", header).group(1))
              for field in ("MAJOR", "MINOR", "PATCH")
          ]
          firmware = ".".join(str(part) for part in parts)
          with open("desktop/pyproject.toml", "rb") as handle:
              package = tomllib.load(handle)["project"]["version"]
          if firmware != package:
              raise SystemExit(f"firmware says {firmware}, package says {package}")

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              if tag.lstrip("v") != package:
                  raise SystemExit(f"tag {tag} does not name version {package}")
          print(f"version={package}")
          PY

  linux:
    name: Firmware, wheel and sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
      - run: cmake --preset Release && cmake --build --preset Release
        working-directory: firmware
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "build>=1,<2"
      - run: python scripts/build_release.py --skip-application
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/firmware/*.elf
      # The frozen application carries the firmware inside it, and only this job has an
      # ARM toolchain. Passing the image on rather than rebuilding it on Windows also
      # means the copy inside the executable and the copy attached to the release are
      # the same build, which two separate compilations could not guarantee.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-image
          path: firmware/build/Release/firmware.elf

  windows:
    name: Frozen application
    needs: [version, linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-image
          path: firmware/build/Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # PyInstaller freezes for the platform it runs on, so this job cannot move to Linux
      # however convenient that would be.
      - run: python -m pip install "./desktop[release]"
      - run: python scripts/build_release.py --skip-wheel --skip-firmware
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  publish:
    name: Publish the release
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets
      - run: find assets -type f | sort
      - name: Write the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Desktop application and firmware for the STM32F407G-DISC1 mixed-signal instrument.

          ### Getting started

          1. Download **\`stm32-msi-${VERSION}.exe\`** and run it. Nothing to install: it
             carries everything it needs, including the matching firmware.
          2. Plug the board into **CN1**, the ST-LINK port.
          3. Press **Flash firmware**, then **Connect**.

          Flashing needs [STM32CubeProgrammer](https://www.st.com/en/development-tools/stm32cubeprog.html)
          installed. It is ST's own tool and cannot be shipped here; it is what actually
          drives the ST-LINK. Everything else works without it.

          The application writes the firmware, then reconnects and asks the board what it is,
          so a flash that did not take is reported rather than assumed. If the board is
          running an older build it still connects, and says so rather than refusing.

          ### Also attached

          \`stm32-msi-${VERSION}.elf\` for flashing by other means, and a wheel and sdist for
          installing as a Python package.

          Measured limits and error budgets are in \`docs/characterization.md\`; what has and
          has not been verified is in \`docs/validation.md\`.
          EOF
          cat notes.md
      # Only a tag publishes. A manual run stops here, having proved the artifacts build.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find assets -type f \( -name '*.whl' -o -name '*.tar.gz' \
            -o -name '*.elf' -o -name '*.exe' \) | sort)
          test ${#files[@]} -ge 4 || { echo "expected at least four assets"; exit 1; }
          # The release may already exist, because publishing from the Releases page creates
          # it before this runs. Attach to it rather than failing on the name clash.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${files[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "STM32 Mixed-Signal Instrument ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              "${files[@]}"
          fi
